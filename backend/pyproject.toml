[project]
name = "ai-soc-agent-team-backend"
version = "0.1.0"
description = "Engineering PoC backend for a semi-autonomous AI+SOC Agent Team."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "opensearch-py>=2.7",
  "openai>=1.0",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
